<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kweppo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Kweppo</h1>
        <div class="subtitle">ekosystem který je opravdu tvůj❤️</div>

        <input type="text" id="searchInput" class="search-input" placeholder="Hledat aplikaci...">

        <div class="apps-grid" id="appsContainer">
            <!-- Sem se dynamicky načtou aplikace z apps.js -->
        </div>

        <footer>
            &copy; 2026 Kweppo team
        </footer>
    </div>

    <!-- Načtení dat a logika -->
    <script src="apps.js"></script>
    <script>
        const container = document.getElementById('appsContainer');
        const searchInput = document.getElementById('searchInput');

        function renderApps(filter = '') {
            container.innerHTML = '';
            
            const filtered = kweppoApps.filter(app => 
                app.name.toLowerCase().includes(filter.toLowerCase()) || 
                app.description.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: #888;">Žádná aplikace nenalezena.</p>';
                return;
            }

            filtered.forEach(app => {
                const card = document.createElement('a');
                card.href = app.url;
                card.className = 'app-card';
                
                card.innerHTML = `
                    <div class="app-icon"><img src="${app.icon}" alt="${app.name}"></div>
                    <div class="app-info">
                        <h3>${app.name}</h3>
                        <p>${app.description}</p>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        renderApps();

        searchInput.addEventListener('input', (e) => {
            renderApps(e.target.value);
        });
    </script>
</body>
</html>
