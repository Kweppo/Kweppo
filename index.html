<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kweppo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Horní widgetová lišta -->
        <div class="top-widgets">
            <div class="widget">
                <span class="widget-icon">📂</span>
                <div>
                    <div class="widget-title">Lokální úložiště</div>
                    <div class="widget-value">Aktivní (IndexedDB)</div>
                </div>
            </div>
            <div class="widget status-widget">
                <span class="widget-icon">⚡</span>
                <div>
                    <div class="widget-title">Stav ekosystému</div>
                    <div class="widget-value">100% Offline & Bezpečné</div>
                </div>
            </div>
        </div>

        <!-- Hlavička projektu -->
        <header class="hub-header">
            <h1>Kweppo</h1>
            <p class="subtitle">ekosystem který je opravdu tvůj ❤️</p>
        </header>

        <!-- Vyhledávání a rychlý panel -->
        <div class="action-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Hledat aplikaci v ekosystému...">
        </div>

        <!-- Hlavní mřížka aplikací -->
        <div class="apps-grid" id="appsContainer">
            <!-- Načteno z apps.js -->
        </div>

        <!-- Patička -->
        <footer>
            <span>&copy; 2026 Kweppo team</span>
            <span class="dot-separator">•</span>
            <a href="#" class="footer-link">O projektu</a>
        </footer>
    </div>

    <!-- Logika a data -->
    <script src="apps.js"></script>
    <script>
        const container = document.getElementById('appsContainer');
        const searchInput = document.getElementById('searchInput');

        function renderApps(filter = '') {
            container.innerHTML = '';
            
            const filtered = kweppoApps.filter(app => 
                app.name.toLowerCase().includes(filter.toLowerCase()) || 
                app.description.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Žádná aplikace neodpovídá hledání.</div>';
                return;
            }

            filtered.forEach(app => {
                const card = document.createElement('a');
                card.href = app.url;
                card.className = 'app-card';
                
                card.innerHTML = `
                    <div class="app-icon-wrapper">
                        <img src="${app.icon}" alt="${app.name}">
                    </div>
                    <div class="app-info">
                        <div class="app-name-row">
                            <h3>${app.name}</h3>
                            <span class="app-tag">Aktivní</span>
                        </div>
                        <p>${app.description}</p>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        renderApps();

        searchInput.addEventListener('input', (e) => {
            renderApps(e.target.value);
        });
    </script>
</body>
</html>
